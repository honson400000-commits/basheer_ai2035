<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basheer AI 2035 - الدفع</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,Tahoma;background:radial-gradient(circle at top,#1a1a1a,#000);color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.card{width:100%;max-width:420px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(20px);border-radius:24px;padding:30px;text-align:center}
.logo{width:64px;height:64px;background:#fff;color:#000;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 16px;font-weight:bold}
h1{font-size:26px;margin-bottom:8px}
.sub{color:#999;font-size:14px;margin-bottom:24px;line-height:1.6}
.price{font-size:42px;font-weight:900;margin:20px 0}
.price span{font-size:16px;color:#888;font-weight:400}
.btn{width:100%;background:#fff;color:#000;border:none;padding:16px;border-radius:14px;font-size:16px;font-weight:bold;cursor:pointer;transition:0.2s}
.btn:hover{transform:scale(1.02)}
.features{text-align:right;margin-top:24px;font-size:13px;color:#aaa;line-height:2}
.features div::before{content:"✓ ";color:#0f0}
.badge{display:inline-block;background:#00ff88;color:#000;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:bold;margin-bottom:12px}
</style>
</head>
<body>
<div class="card">
<div class="badge">LIVE • 2035</div>
<div class="logo">B</div>
<h1>بشير AI 2035 🤖</h1>
<p class="sub">نظام الذكاء الاصطناعي المتكامل - ادفع الآن وفعّل اشتراكك فوراً</p>
<div class="price">49<span> ريال / شهرياً</span></div>
<button class="btn" onclick="pay()">ادفع الآن - تفعيل فوري ⚡</button>
<div class="features">
<div>ذكاء اصطناعي غير محدود</div>
<div>دعم فني 24/7</div>
<div>تفعيل فوري بعد الدفع</div>
<div>يعمل على basheerai2035.vercel.app</div>
</div>
</div>
<script>
function pay(){
  // هنا تحط رابط الدفع حقك
  window.location.href = "pay.html";
}
</script>
</body>
</html>
